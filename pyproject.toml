[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofre-universal"
version = "0.1.1"
description = "Gerenciador local de credenciais de API para Windows"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6>=6.8,<7", "PyNaCl>=1.6,<2", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7"]
mcp = ["mcp>=2,<3"]

[project.scripts]
cofre = "cofre_universal.cli:main"

[tool.setuptools.packages.find]
include = ["cofre_universal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
